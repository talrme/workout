<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Workout</title>
  <meta name="theme-color" content="#f4f7ef">
  <meta name="apple-mobile-web-app-title" content="Workout">
  <link rel="icon" href="dumbell-2.png?v=20261014" type="image/png">
  <link rel="apple-touch-icon" href="dumbell-2.png?v=20261014">
  <link rel="manifest" href="manifest.webmanifest?v=20261014-dumbbell-2">
  <link rel="stylesheet" href="styles.css?v=20261014-workout-refresh">
</head>
<body>
  <main class="app-shell">
    <header class="hero">
      <img class="hero-logo" src="dumbell-2.png?v=20261014" width="64" height="64" alt="">
      <h1>Workout</h1>
    </header>

    <section class="machine-panel" aria-label="Workout machines">
      <div class="table-scroll">
        <table class="machine-table">
          <thead data-table-head></thead>
          <tbody data-machine-table></tbody>
        </table>
      </div>
      <div class="table-actions" data-table-actions></div>
      <div class="workout-legend" data-suggestion-legend hidden>
        <span class="suggestion-swatch" aria-hidden="true"></span>
        <span><strong>Suggested workout</strong> - not done in the last 3 workout days.</span>
      </div>
    </section>

    <footer class="sheet-footer">
      <p class="training-note"><strong>Goal:</strong> Last 2 reps: effort <strong>7/10 in set 1</strong>, <strong>8/10 in set 2</strong>, and <strong>9/10 in set 3</strong>.</p>
    </footer>
    <div class="bottom-settings">
      <button type="button" class="settings-button" data-open-settings aria-label="Open settings" title="Settings"><span class="settings-glyph" aria-hidden="true"></span><span>Settings</span></button>
    </div>
  </main>

  <div class="modal-backdrop" data-settings-backdrop hidden></div>
  <section class="settings-modal" data-settings-modal hidden role="dialog" aria-modal="true" aria-labelledby="settings-title">
    <div class="settings-panel">
      <header>
        <div>
          <p class="eyebrow">Workout</p>
          <h2 id="settings-title">Settings</h2>
        </div>
        <button type="button" data-close-settings aria-label="Close settings">×</button>
      </header>
      <fieldset class="palette-setting">
        <legend>Color scheme</legend>
        <div class="palette-picker">
          <button type="button" data-theme="garden" aria-pressed="true"><span class="palette-swatch garden" aria-hidden="true"></span>Garden</button>
          <button type="button" data-theme="tide" aria-pressed="false"><span class="palette-swatch tide" aria-hidden="true"></span>Tide</button>
          <button type="button" data-theme="moon" aria-pressed="false"><span class="palette-swatch moon" aria-hidden="true"></span>Moon</button>
          <button type="button" data-theme="sunrise" aria-pressed="false"><span class="palette-swatch sunrise" aria-hidden="true"></span>Sunrise</button>
        </div>
      </fieldset>
      <label class="toggle-row"><span>Show workout notes</span><input type="checkbox" data-show-notes></label>
      <label class="toggle-row"><span>Show setup notes in table</span><input type="checkbox" data-show-setup></label>
      <details class="advanced-settings">
        <summary>Advanced settings</summary>
        <div class="advanced-panel">
          <label><span>Name</span><input data-profile-name type="text" autocomplete="name" placeholder="Tal"></label>
          <label class="toggle-row"><span>Auto sync</span><input type="checkbox" data-auto-sync></label>
          <label class="toggle-row"><span>Reduce motion</span><input type="checkbox" data-reduce-motion></label>
          <a data-sheet-link href="https://docs.google.com/spreadsheets/d/1iOg845q_IxXqVDmVxSjuRTdEVA19JaLvECDnTK-BL3Y/edit" target="_blank" rel="noreferrer">Google Sheet ↗</a>
          <span class="sync-pill" data-sync-note>Loading sheet...</span>
          <button type="button" class="danger" data-reset-site>Reset local</button>
        </div>
      </details>
      <div class="settings-actions"><button type="button" class="primary" data-save-settings>Save</button></div>
    </div>
  </section>

  <div class="modal-backdrop" data-workout-backdrop hidden></div>
  <section class="workout-modal" data-workout-modal hidden role="dialog" aria-modal="true" aria-labelledby="workout-title">
    <div class="workout-panel">
      <header>
        <div>
          <p class="eyebrow">New row</p>
          <h2 id="workout-title">Add workout</h2>
        </div>
        <button type="button" data-close-workout aria-label="Close add workout">×</button>
      </header>
      <div class="workout-fields">
        <label>
          <span>Name</span>
          <input data-workout-name type="text" placeholder="Calf Raise">
        </label>
        <label>
          <span>Section</span>
          <select data-workout-group>
            <option>Legs</option>
            <option>Upper body</option>
            <option>Core</option>
            <option>Physical therapy</option>
            <option>Other</option>
          </select>
        </label>
        <label>
          <span>Starting weight</span>
          <input data-workout-default type="text" placeholder="50">
        </label>
      </div>
      <label>
        <span>Setup notes</span>
        <textarea data-workout-setup rows="3" placeholder="Seat, form, or reminder"></textarea>
      </label>
      <div class="workout-actions">
        <button type="button" class="primary" data-save-workout>Save workout</button>
        <button type="button" data-cancel-workout>Cancel</button>
      </div>
    </div>
  </section>

  <script src="config.js?v=20260918-mobile-add-day"></script>
  <script src="app.js?v=20261014-workout-refresh"></script>
</body>
</html>
