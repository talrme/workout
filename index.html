<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Workout</title>
  <meta name="theme-color" content="#f4f7ef">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="app-shell">
    <header class="hero">
      <h1>Workout</h1>
      <button type="button" class="settings-button" data-open-settings aria-label="Open settings" title="Settings">
        <span class="settings-glyph" aria-hidden="true"></span>
      </button>
    </header>

    <section class="machine-panel" aria-label="Workout machines">
      <div class="panel-heading">
        <div>
          <p class="eyebrow">Machines</p>
          <h2>Recent weights</h2>
        </div>
        <p data-sync-note>Loading sheet...</p>
      </div>
      <div class="table-scroll">
        <table class="machine-table">
          <thead data-table-head></thead>
          <tbody data-machine-table></tbody>
        </table>
      </div>
    </section>

    <footer class="sheet-footer">
      <a data-sheet-link href="https://docs.google.com/spreadsheets/d/1iOg845q_IxXqVDmVxSjuRTdEVA19JaLvECDnTK-BL3Y/edit?gid=868528902#gid=868528902" target="_blank" rel="noreferrer">Google Sheet</a>
    </footer>
  </main>

  <div class="modal-backdrop" data-settings-backdrop hidden></div>
  <section class="settings-modal" data-settings-modal hidden role="dialog" aria-modal="true" aria-labelledby="settings-title">
    <div class="settings-panel">
      <header>
        <div>
          <p class="eyebrow">Workout</p>
          <h2 id="settings-title">Settings</h2>
        </div>
        <button type="button" data-close-settings aria-label="Close settings">x</button>
      </header>
      <label>
        <span>Name</span>
        <input data-profile-name type="text" autocomplete="name" placeholder="Tal">
      </label>
      <label class="toggle-row">
        <span>Sync on open</span>
        <input type="checkbox" data-auto-sync>
      </label>
      <label class="toggle-row">
        <span>Reduce motion</span>
        <input type="checkbox" data-reduce-motion>
      </label>
      <div class="settings-actions">
        <button type="button" class="primary" data-save-settings>Save</button>
        <button type="button" data-reset-site>Reset local</button>
      </div>
    </div>
  </section>

  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
