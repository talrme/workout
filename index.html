<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Workout</title>
  <meta name="theme-color" content="#f4f7ef">
  <meta name="apple-mobile-web-app-title" content="Workout">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="workout-icon.png">
  <link rel="manifest" href="manifest.webmanifest?v=20260918-real-data">
  <link rel="stylesheet" href="styles.css?v=20260918-real-data">
</head>
<body>
  <main class="app-shell">
    <header class="hero">
      <h1>Workout</h1>
      <button type="button" class="settings-button" data-open-settings aria-label="Open settings" title="Settings">
        <span class="settings-glyph" aria-hidden="true"></span>
      </button>
    </header>

    <section class="machine-panel" aria-label="Workout machines">
      <div class="table-scroll">
        <table class="machine-table">
          <thead data-table-head></thead>
          <tbody data-machine-table></tbody>
        </table>
      </div>
      <div class="workout-legend" data-suggestion-legend hidden>
        <span class="suggestion-swatch" aria-hidden="true"></span>
        <span><strong>Suggested workout</strong> - not done in the last 3 workout days.</span>
      </div>
    </section>

    <footer class="sheet-footer">
      <span class="sync-pill" data-sync-note>Loading sheet...</span>
      <a data-sheet-link href="https://docs.google.com/spreadsheets/d/1iOg845q_IxXqVDmVxSjuRTdEVA19JaLvECDnTK-BL3Y/edit?gid=868528902#gid=868528902" target="_blank" rel="noreferrer">Google Sheet</a>
    </footer>
  </main>

  <div class="modal-backdrop" data-settings-backdrop hidden></div>
  <section class="settings-modal" data-settings-modal hidden role="dialog" aria-modal="true" aria-labelledby="settings-title">
    <div class="settings-panel">
      <header>
        <div>
          <p class="eyebrow">Workout</p>
          <h2 id="settings-title">Settings</h2>
        </div>
        <button type="button" data-close-settings aria-label="Close settings">x</button>
      </header>
      <label>
        <span>Name</span>
        <input data-profile-name type="text" autocomplete="name" placeholder="Tal">
      </label>
      <label class="toggle-row">
        <span>Auto sync</span>
        <input type="checkbox" data-auto-sync>
      </label>
      <label class="toggle-row">
        <span>Reduce motion</span>
        <input type="checkbox" data-reduce-motion>
      </label>
      <label class="toggle-row">
        <span>Hide today's notes from table</span>
        <input type="checkbox" data-hide-today-notes>
      </label>
      <div class="settings-actions">
        <button type="button" class="primary" data-save-settings>Save</button>
        <button type="button" data-reset-site>Reset local</button>
      </div>
    </div>
  </section>

  <div class="modal-backdrop" data-date-backdrop hidden></div>
  <section class="date-modal" data-date-modal hidden role="dialog" aria-modal="true" aria-labelledby="date-title">
    <div class="date-panel">
      <header>
        <div>
          <p class="eyebrow">Workout day</p>
          <h2 id="date-title" data-date-title>Edit day</h2>
        </div>
        <button type="button" data-close-date aria-label="Close date editor">x</button>
      </header>
      <label class="date-field">
        <span>Date</span>
        <input data-edit-date type="date">
      </label>
      <div class="day-machine-list" data-day-machine-list></div>
      <div class="date-actions">
        <button type="button" class="primary" data-save-date>Save day</button>
        <button type="button" class="danger" data-delete-date>Delete day</button>
        <button type="button" data-cancel-date>Cancel</button>
      </div>
    </div>
  </section>

  <div class="modal-backdrop" data-workout-backdrop hidden></div>
  <section class="workout-modal" data-workout-modal hidden role="dialog" aria-modal="true" aria-labelledby="workout-title">
    <div class="workout-panel">
      <header>
        <div>
          <p class="eyebrow">New row</p>
          <h2 id="workout-title">Add workout</h2>
        </div>
        <button type="button" data-close-workout aria-label="Close add workout">x</button>
      </header>
      <div class="workout-fields">
        <label>
          <span>Name</span>
          <input data-workout-name type="text" placeholder="Calf Raise">
        </label>
        <label>
          <span>Section</span>
          <select data-workout-group>
            <option>Legs</option>
            <option>Upper body</option>
            <option>Core</option>
            <option>Other</option>
          </select>
        </label>
        <label>
          <span>Value label</span>
          <select data-workout-value-label>
            <option>Weight</option>
            <option>Time</option>
          </select>
        </label>
        <label>
          <span>Default value</span>
          <input data-workout-default type="text" placeholder="50">
        </label>
      </div>
      <label>
        <span>Setup notes</span>
        <textarea data-workout-setup rows="3" placeholder="Seat, form, or reminder"></textarea>
      </label>
      <div class="workout-actions">
        <button type="button" class="primary" data-save-workout>Save workout</button>
        <button type="button" data-cancel-workout>Cancel</button>
      </div>
    </div>
  </section>

  <script src="config.js?v=20260918-real-data"></script>
  <script src="app.js?v=20260918-real-data"></script>
</body>
</html>
